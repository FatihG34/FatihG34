name: Update GitHub Profile Statistics

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 03:17 UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "config/profile.json"
      - ".github/workflows/profile-update.yml"

permissions:
  contents: write

concurrency:
  group: profile-statistics-update
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "false"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate public profile statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: FatihG34
        run: python scripts/generate_profile.py

      - name: Commit generated assets
        run: |
          if [[ -n "$(git status --porcelain assets/statistics)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/statistics/
            git commit -m "chore: update profile statistics"
            git push
          else
            echo "Statistics are unchanged."
          fi
